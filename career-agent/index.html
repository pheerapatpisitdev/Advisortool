    { key: 'business', label: 'ความคาดหวังทางธุรกิจ' },

    { key: 'financial', label: 'การวางแผนการเงินและเกษียณ' },

  const mcqQuestions = [
    { id: 1, q: "หากเราวางแผนได้ดี ย่อมมีผลที่ดีตามมา", type: "likert", scoreType: "normal", section: "plan" },
    { id: 2, q: "ตราบใดที่ฉันทำงานที่ฉันรับผิดชอบได้ดี ฉันสามารถเลิกงานได้ตามที่ฉันต้องการ", type: "likert", scoreType: "inverse", section: "plan" },
    { id: 3, q: "ถ้ามีคนทำผิด ฉันจะได้บอกว่าเขาทำผิด", type: "likert", scoreType: "normal", section: "self" },
    { id: 4, q: "คนส่วนใหญ่เรียนรู้จากฉันในเรื่องต่าง ๆ", type: "likert", scoreType: "normal", section: "learn" },
    { id: 5, q: "หากเปิดใจยอมรับ การพัฒนาตนเองจะเกิดขึ้นได้เสมอ", type: "likert", scoreType: "normal", section: "learn" },
    { id: 6, q: "ฉันยอมรับคำวิจารณ์ เพราะมันเป็นสิ่งที่เป็นประโยชน์สำหรับฉัน", type: "likert", scoreType: "normal", section: "learn" },
    { id: 7, q: "ฉันคิดว่าฉันเองว่า ฉัน.......", type: "choice", scoreType: "normal", section: "self", options: ["ต้องเป็นที่ 1 หรือ ยอดเยี่ยมที่สุดเสมอ", "ยอมรับได้หากได้ลำดับที่ 2 หรือ 3 ในการแข่งขัน", "พึงพอใจในสถานการณ์ปัจจุบัน แต่ทุกสิ่งควรดีขึ้นกว่าเดิม", "เป็นนักจัดหาสิ่งที่ตอบสนองความจำเป็นขั้นพื้นฐานของชีวิตที่ยอดเยี่ยม", "ปล่อยให้ทุกอย่างเป็นไปตามโชคชะตา"] },
    { id: 8, q: "ฉันเห็นคุณค่าของการกำหนดเป้าหมายและบรรลุเป้าหมาย", type: "likert", scoreType: "normal", section: "plan" },
    { id: 9, q: "ฉันมีแผนประจำปี และเป้าหมายของฉัน สำเร็จ..... ต่อปี", type: "choice", scoreType: "normal", section: "plan", options: ["0", "1-2", "3-4", "มากกว่า 5", "เป้าหมายที่วางไว้ใช้เวลามากกว่า 1 ปี จึงจะสำเร็จได้"] },
    { id: 10, q: "คุณคิดว่าจะมีลูกค้าซื้อประกันชีวิตกับคุณกี่คน", type: "choice", scoreType: "normal", section: "business", options: ["น้อยกว่า 10", "10-50", "50-100", "100-150", "มากกว่า 150"] },
    { id: 11, q: "คุณคิดว่าจะมีลูกค้าจากตลาดธรรมชาติกี่เปอร์เซ็นต์จากลูกค้าทั้งหมด", type: "choice", scoreType: "normal", section: "business", options: ["1-20%", "20-40%", "40-60%", "60-80%", "80-100%"] },
    { id: 12, q: "คนที่ฉันรู้จัก เห็นด้วยกับการตัดสินใจเป็นตัวแทนประกันชีวิต", type: "likert", scoreType: "normal", section: "business" },
    { id: 13, q: "ฉันจะดำเนินการทุกอย่างตามแผนเสมอ", type: "likert", scoreType: "normal", section: "plan" },
    { id: 14, q: "หากเผชิญปัญหา หรือไม่เป็นไปตามแผนที่วางไว้ ฉันจะหยุด และล้มเลิกการดำเนินการ", type: "likert", scoreType: "inverse", section: "plan" },
    { id: 15, q: "คนที่ฉันรู้จักฉันเป็นอย่างดี มองว่า ฉันเป็นคนที่ :", type: "choice", scoreType: "normal", section: "self", options: ["ขับเคลื่อนด้วยเป้าหมายที่ชัดเจนและด้วยความทะเยอทะยาน", "กระตือรือร้นและมองหาความท้าทายใหม่ๆ", "เปิดรับความท้าทายใหม่ๆ แต่จะไม่เดินหน้าเข้าหาสิ่งนั้น", "มักนั่งรอให้อะไรบางอย่างเกิดขึ้น", "ความเปลี่ยนแปลงไม่มีผลกระทบกับฉัน"] },
    { id: 16, q: "ฉันสามารถควบคุมอารมณ์ได้เป็นอย่างดีในสถานการณ์ต่าง ๆ", type: "likert", scoreType: "normal", section: "self" },
    { id: 17, q: "ฉันมีแรงกระตุ้นในตนเอง และชอบความท้าทาย", type: "likert", scoreType: "normal", section: "self" },
    { id: 18, q: "ฉันต้องการคำแนะนำในการทำสิ่งต่าง ๆ เพื่อความมั่นใจในตนเอง", type: "likert", scoreType: "inverse", section: "self" },
    { id: 19, q: "ฉันชอบมีเพื่อนมาก และ พบปะผู้คนใหม่ ๆ", type: "likert", scoreType: "normal", section: "social" },
    { id: 20, q: "ฉันคิดว่าฉันเป็นคนที่", type: "choice", scoreType: "normal", section: "social", options: ["ชอบออกสังคมและเข้ากับคนง่าย", "เป็นมิตร และ ช่างพูด ช่างคุย", "มีส่วนร่วมในการพูดคุยด้วย", "สุขุม และ หนักแน่น", "ทำงานได้อย่างยอดเยี่ยมเมื่ออยู่ลำพัง"] },
    { id: 21, q: "ฉันชอบการมีส่วนร่วมในวงสนทนากับคนอื่น ๆ", type: "likert", scoreType: "normal", section: "social" },
    { id: 22, q: "หากไปในที่ไม่รู้จักใคร ฉันมักจะรอให้คนอื่นเริ่มชวนคุยก่อน", type: "likert", scoreType: "inverse", section: "social" },
    { id: 23, q: "ฉันไม่ยอมให้ใครมาทำให้ฉันรู้สึกด้อยกว่าได้", type: "likert", scoreType: "normal", section: "self" },
    { id: 24, q: "ฉันต้องรู้ว่ามีความคาดหวังอะไรจากฉัน ฉันจึงจะรู้สึกสบายใจ", type: "likert", scoreType: "inverse", section: "self" },
    { id: 25, q: "ความคุ้มครองของประกันชีวิต มีไว้สำหรับหัวหน้าครอบครัว หรือ คนที่หารายได้หลักเท่านั้น", type: "likert", scoreType: "inverse", section: "insurance" },
    { id: 26, q: "การประกันชีวิตยังไม่ได้เป็นที่ยอมรับของคนส่วนใหญ่", type: "likert", scoreType: "inverse", section: "insurance" },
    { id: 27, q: "ฉันไม่กล้านำเสนอประกันชีวิตให้กับคนรู้จัก การเริ่มต้นกับคนไม่รู้จักนั้นง่ายกว่า", type: "likert", scoreType: "inverse", section: "insurance" },
    { id: 28, q: "อายุที่เหมาะสมในการวางแผนการเกษียณอายุคือ.....ปี", type: "choice", scoreType: "normal", section: "financial", options: ["25 ถึง 35", "35 ถึง 40", "40 ถึง 45", "45 ถึง 50", "50 ถึง 55"] },
    { id: 29, q: "สิ่งสำคัญที่สุดในการวางแผนการเงินคือ การรวบรวมข้อมูลของลูกค้าก่อนให้คำแนะนำ", type: "likert", scoreType: "normal", section: "financial" },
    { id: 30, q: "ผู้ที่มีความมั่งคั่งทางการเงินเท่านั้น ที่ควรวางแผนการเงิน", type: "likert", scoreType: "inverse", section: "financial" },
  ];

  const likertOptions = ["เห็นด้วยอย่างยิ่ง", "เห็นด้วย", "ไม่มีความคิดเห็น", "ไม่เห็นด้วย", "ไม่เห็นด้วยอย่างยิ่ง"];
  const choiceLabels = ["ก.", "ข.", "ค.", "ง.", "จ."];

  const personalFields = ['ชื่อ-นามสกุล', 'หมายเลขโทรศัพท์', 'อายุ', 'Email Address'];
  const maritalStatuses = ["โสด", "โสดแต่มีผู้อยู่ในอุปการะ", "สมรส", "สมรสและมีบุตร", "อื่นๆ"];
  const openEndedItems = [
    { id: 'interest', q: "ความสนใจ / งานอดิเรก ของคุณคืออะไร?" },
    { id: 'roleModel', q: "บุคคลที่คุณให้ความเคารพมากที่สุดคือใคร? เพราะอะไร?" },
    { id: 'hardestDecision', q: "ในการทำงานที่ผ่านมา คุณเคยตัดสินใจเรื่องใดที่คุณคิดว่ายากที่สุด? และส่งผลอย่างไร?" },
    { id: 'failure', q: "คุณเคยเผชิญกับความล้มเหลวร้ายแรงในชีวิตการทำงานหรือไม่? แล้วคุณรับมือกับเรื่องนั้นอย่างไร?" },
    { id: 'honesty', q: "ในการทำงานที่ผ่านมา คุณเคยถูกทดสอบความซื่อสัตย์ สุจริต บ้างหรือไม่? แล้วคุณรับมืออย่างไร?" },
    { id: 'protectClient', q: "คนทุกคนย่อมต้องได้รับการคุ้มครองดูแลผลประโยชน์ส่วนตัว คุณจะมีวิธีดูแลผลประโยชน์ให้ลูกค้าอย่างไร?" },
    { id: 'relationship', q: "คุณจะสร้างความสัมพันธ์กับลูกค้าในระยะยาวได้อย่างไรบ้าง?" },
  ];

  /* ===================== ไอคอน (inline SVG แทน lucide-react) ===================== */
  const icon = {
    chevronRight: (c='w-5 h-5') => `<svg class="${c}" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>`,
    user: (c='w-5 h-5') => `<svg class="${c}" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
    fileText: (c='w-5 h-5') => `<svg class="${c}" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>`,
    messageSquare: (c='w-5 h-5') => `<svg class="${c}" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`,
    send: (c='w-5 h-5') => `<svg class="${c}" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg>`,
  };

  /* ===================== State ===================== */
  const state = {
    step: 0,
    formData: { personal: {}, openEnded: {}, mcq: {}, supplementary: {} },
  };

  const esc = (s) => String(s ?? '')
    .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;').replaceAll("'", '&#39;');

  function handleInputChange(section, field, value) {
    state.formData[section] = { ...state.formData[section], [field]: value };
  }

  /* ===================== คิดคะแนน (ตรรกะเดิม) ===================== */
  function calculateScore() {
    const orderedIds = mcqSections.flatMap((s) =>
      mcqQuestions.filter((q) => q.section === s.key).map((q) => q.id)
    );
    const displayOrderById = {};
    orderedIds.forEach((id, i) => { displayOrderById[id] = i + 1; });

    let total = 0;
    const details = [];
    const sectionTotals = {};
    mcqSections.forEach((s) => { sectionTotals[s.key] = { label: s.label, total: 0, details: [] }; });

    mcqQuestions.forEach((q) => {
      const answer = state.formData.mcq[q.id];
      const options = q.type === 'likert' ? likertOptions : q.options;
      const index = options.indexOf(answer);

      let score = 0;
      if (answer) {
        if (q.scoreType === 'normal') score = 5 - index; // ก=5, จ=1
        else score = index + 1;                          // ก=1, จ=5
        total += score;
      }

      const item = {
        id: q.id,
        displayOrder: displayOrderById[q.id] ?? q.id,
        question: q.q,
        score,
        answer: answer || 'ไม่ได้ระบุ',
        label: index !== -1 ? choiceLabels[index] : '-',
        section: q.section,
      };
      details.push(item);
      if (q.section && sectionTotals[q.section]) {
        sectionTotals[q.section].total += score;
        sectionTotals[q.section].details.push(item);
      }
    });

    const bySection = mcqSections.map((s) => ({
      key: s.key, label: s.label,
      total: sectionTotals[s.key]?.total ?? 0,
      details: sectionTotals[s.key]?.details ?? [],
    }));

    return { total, details, bySection };
  }

  function getScoreCategory(total) {
    if (total >= 118) return { key: 'green', label: 'เขียว' };
    if (total >= 80) return { key: 'orange', label: 'ส้ม' };
    return { key: 'red', label: 'แดง' };
  }

  /* ===================== ส่ง ===================== */
  function submitAndShowResults() {
    state.step = 3;
    render();
  }

  /* ===================== ตรวจสอบก่อนส่ง (validation) ===================== */
  function validateAndSubmit() {
    // 1) ต้องตอบคำถามปรนัยครบทุกข้อ (30 ข้อ)
    const firstUnanswered = mcqQuestions.find((q) => !state.formData.mcq[q.id]);
    if (firstUnanswered) {
      const err = document.getElementById('mcq-error');
      if (err) {
        err.textContent = 'กรุณาตอบคำถามให้ครบทุกข้อก่อนส่งแบบสอบถาม';
        err.classList.remove('hidden');
      }
      const wrap = document.querySelector(`[data-qwrap="${firstUnanswered.id}"]`);
      if (wrap) {
        wrap.classList.add('caq-invalid');
        wrap.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      return;
    }

    // 2) ต้องกรอกข้อมูลส่วนตัวที่จำเป็น (ชื่อ-นามสกุล / หมายเลขโทรศัพท์)
    const p = state.formData.personal || {};
    const missing = [];
    if (!String(p['ชื่อ-นามสกุล'] || '').trim()) missing.push('ชื่อ-นามสกุล');
    if (!String(p['หมายเลขโทรศัพท์'] || '').trim()) missing.push('หมายเลขโทรศัพท์');
    if (missing.length) {
      state.step = 1;
      render();
      const err = document.getElementById('personal-error');
      if (err) {
        err.textContent = 'กรุณากรอก ' + missing.join(' และ ') + ' ก่อนส่งแบบสอบถาม';
        err.classList.remove('hidden');
      }
      const field = document.querySelector(`[data-personal="${missing[0]}"]`);
      if (field) {
        field.classList.add('caq-invalid');
        try { field.focus({ preventScroll: true }); } catch (e) { field.focus(); }
        field.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      return;
    }

    submitAndShowResults();
  }

  function shareSummaryToLine() {
    const personal = state.formData.personal ?? {};
    const openEnded = state.formData.openEnded ?? {};
    const total = calculateScore().total;
    const category = total >= 118 ? 'เขียว (118+)' : total >= 80 ? 'ส้ม (80–117)' : 'แดง (40–79 หรือต่ำกว่า)';
    const messageLines = [
      '📋 ผลแบบสอบถามความถนัดในอาชีพ',
      `ชื่อ-นามสกุล: ${personal['ชื่อ-นามสกุล'] || '-'}`,
      `โทรศัพท์: ${personal['หมายเลขโทรศัพท์'] || '-'}`,
      `อายุ: ${personal['อายุ'] || '-'}`,
      `คะแนนรวม: ${total} / 150`,
      `ระดับ: ${category}`,
      '',
      '📝 ประสบการณ์และทัศนคติ',
    ];
    const openBlocks = [
      ['ความสนใจ / งานอดิเรก', openEnded.interest],
      ['บุคคลที่คุณเคารพมากที่สุด', openEnded.roleModel],
      ['การตัดสินใจที่ยากที่สุด', openEnded.hardestDecision],
      ['ความล้มเหลวและการรับมือ', openEnded.failure],
      ['การทดสอบความซื่อสัตย์', openEnded.honesty],
      ['การดูแลผลประโยชน์ลูกค้า', openEnded.protectClient],
      ['การสร้างความสัมพันธ์ระยะยาว', openEnded.relationship],
    ];
    openBlocks.forEach(([label, ans]) => {
      if (ans) messageLines.push(`• ${label}: ${String(ans).trim().slice(0, 180)}`);
    });
    const text = messageLines.join('\n');
    window.open(`https://line.me/R/msg/text/?${encodeURIComponent(text)}`, '_blank', 'noopener,noreferrer');
  }

              <span class="inline-block px-3 py-1 rounded-full bg-[#D97757] text-white font-bold text-sm shadow-sm whitespace-nowrap">118</span>
            </div>
          </div>
          <div class="flex justify-between text-[10px] sm:text-xs font-bold text-text-secondary px-0.5">
            <span>0</span><span>150</span>
          </div>
        </div>

        <div class="flex flex-wrap items-center justify-center gap-3 sm:gap-5 py-3 sm:py-4">
          <span class="text-text-secondary font-medium text-sm sm:text-base shrink-0">คะแนนรวมของคุณ</span>
          <span class="text-3xl sm:text-4xl font-black tabular-nums tracking-wider text-text-primary-light whitespace-nowrap px-1">${score.total}</span>
          <span class="px-2.5 sm:px-3 py-1 rounded-full font-bold text-xs sm:text-sm text-white shrink-0 ${yourBadge}">${cat.label}</span>
        </div>

        <div class="pt-4 sm:pt-6 border-t border-border-light">
          <h3 class="font-bold text-base sm:text-lg text-text-primary-light mb-3 sm:mb-4">คะแนนแยกตามส่วน (ลักษณะบุคลิกภาพ)</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2 sm:gap-3">${bySection}</div>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
        <div class="p-4 sm:p-6 bg-surface-light rounded-xl sm:rounded-2xl border border-border-light space-y-3 sm:space-y-4">
          <h3 class="font-bold text-lg sm:text-xl text-text-primary-light flex items-center gap-2">${icon.user('w-4 h-4 sm:w-5 sm:h-5 text-[#D97757] shrink-0')}ข้อมูลส่วนตัว</h3>
          <dl class="space-y-2 sm:space-y-3 text-xs sm:text-sm">${personalRows}</dl>
        </div>
        <div class="p-4 sm:p-6 bg-surface-light rounded-xl sm:rounded-2xl border border-border-light space-y-3 sm:space-y-4">
          <h3 class="font-bold text-lg sm:text-xl text-text-primary-light flex items-center gap-2">${icon.fileText('w-4 h-4 sm:w-5 sm:h-5 text-[#D97757] shrink-0')}ประสบการณ์และทัศนคติ</h3>
          <div class="space-y-3 sm:space-y-4 text-xs sm:text-sm">${openAnswers}</div>
        </div>
      </div>

      <div class="bg-[#D97757]/10 border-2 border-[#D97757]/40 p-4 sm:p-6 md:p-8 rounded-xl sm:rounded-2xl text-center space-y-3 sm:space-y-4">
        <h4 class="text-lg sm:text-xl font-black text-text-primary-light">ขั้นตอนสำคัญ: ส่งคำตอบของคุณ</h4>
        <p class="text-text-secondary text-xs sm:text-sm max-w-md mx-auto">คำตอบยังไม่ถูกจัดเก็บโดยอัตโนมัติ กรุณากดปุ่มด้านล่างเพื่อส่งสรุปคำตอบไปยังผู้ดูแลผ่าน LINE</p>
        <button data-action="share-line" type="button" class="min-h-[52px] w-full sm:w-auto mx-auto px-8 sm:px-12 py-3.5 sm:py-4 rounded-full text-base sm:text-lg font-black flex items-center justify-center gap-2 shadow-xl touch-manipulation bg-[#D97757] text-white hover:bg-[#E8845C] active:bg-[#C4623F] hover:-translate-y-0.5 transition-all" title="เปิด LINE เพื่อแชร์สรุปคำตอบ (ไม่ต้องตั้งค่า token)">
          ${icon.send('w-5 h-5 sm:w-6 sm:h-6 shrink-0')} แชร์ส่งคำตอบไปที่ LINE
        </button>
        <p class="text-[10px] sm:text-xs text-text-secondary text-center max-w-xs mx-auto">กดแล้วจะเปิด LINE ให้เลือกผู้รับส่งได้ทันที</p>
      </div>

      <div class="text-center pt-2">
        <button data-action="restart" class="min-h-[44px] px-6 sm:px-8 py-2.5 sm:py-3 bg-surface-light text-text-primary-light border border-border-light rounded-xl font-bold hover:bg-bubble-user-light transition-all active:scale-95 text-sm sm:text-base touch-manipulation">กลับไปเริ่มต้นใหม่</button>
      </div>
    </div>`;
  }

  /* ===================== Render + Events ===================== */
  function render() {
    const progress = (state.step > 0 && state.step < 3)
      ? `<div role="progressbar" aria-valuenow="${state.step}" aria-valuemin="1" aria-valuemax="2" aria-label="ความคืบหน้าแบบสอบถาม ส่วนที่ ${state.step} จาก 2" class="w-full bg-[#D97757]/20 h-1.5 sm:h-2 flex"><div class="bg-[#D97757] h-full transition-all duration-1000 ease-in-out" style="width:${(state.step / 2) * 100}%"></div></div>
         <p class="text-center text-xs sm:text-sm text-text-secondary py-1.5">ส่วนที่ ${state.step} จาก 2</p>`
      : '';

    let body = '';
    if (state.step === 0) body = renderWelcome();
    else if (state.step === 1) body = renderPart1();
    else if (state.step === 2) body = renderPart2();
    else if (state.step === 3) body = renderSuccess();

    document.getElementById('root').innerHTML = `
      <div class="min-h-screen bg-surface-light py-4 px-3 sm:py-6 sm:px-4 md:py-10 md:px-4">
        <div class="max-w-4xl mx-auto bg-surface-light rounded-2xl sm:rounded-3xl shadow-2xl shadow-border-light/50 border border-border-light overflow-hidden">
          ${progress}
          <div class="p-4 sm:p-6 md:p-8 lg:p-16">${body}</div>
        </div>
      </div>`;

    if (state.step === 3) {
      const el = document.getElementById('results-top');
      if (el && 'scrollIntoView' in el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      else window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  // Event delegation
  document.addEventListener('click', (e) => {
    const actionEl = e.target.closest('[data-action]');
    if (actionEl) {
      const a = actionEl.getAttribute('data-action');
      if (a === 'next') { state.step += 1; render(); }
      else if (a === 'prev') { state.step -= 1; render(); }
      else if (a === 'submit') { validateAndSubmit(); }
      else if (a === 'restart') {
        if (window.confirm('ต้องการเริ่มทำแบบสอบถามใหม่หรือไม่? คำตอบทั้งหมดที่กรอกไว้จะถูกล้าง')) {
          window.location.reload();
        }
      }
      else if (a === 'share-line') { shareSummaryToLine(); }
      return;
    }
    const maritalEl = e.target.closest('[data-marital]');
    if (maritalEl) {
      handleInputChange('personal', 'maritalStatus', maritalEl.getAttribute('data-marital'));
      render();
      return;
    }
    const mcqEl = e.target.closest('[data-mcq]');
    if (mcqEl) {
      handleInputChange('mcq', Number(mcqEl.getAttribute('data-mcq')), mcqEl.getAttribute('data-opt'));
      render();
      return;
    }
  });

  // Inputs ที่ไม่ต้อง re-render (เก็บค่า + คงโฟกัส)
  document.addEventListener('input', (e) => {
    const pf = e.target.getAttribute && e.target.getAttribute('data-personal');
    if (pf) { handleInputChange('personal', pf, e.target.value); return; }
    const oe = e.target.getAttribute && e.target.getAttribute('data-openended');
    if (oe) { handleInputChange('openEnded', oe, e.target.value); return; }
  });
  document.addEventListener('change', (e) => {
    const pf = e.target.getAttribute && e.target.getAttribute('data-personal');
    if (pf) { handleInputChange('personal', pf, e.target.value); }
  });

  render();
  </script>

</body>
</html>
