<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Advisortool — Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --az-header-h: 64px; }
    * { box-sizing: border-box; }
    body { margin: 0; }

    .az-shell {
      font-family: 'IBM Plex Sans Thai', system-ui, sans-serif;
      background: #f4f5f7;
      min-height: calc(100dvh - var(--az-header-h));
      color: #33415c;
    }

    .az-header {
      position: sticky; top: 0; z-index: 120;
      display: flex; align-items: center; justify-content: space-between;
      height: var(--az-header-h); padding: 0 22px;
      background: #ffffff; border-bottom: 1px solid #e9eaee;
      font-family: 'IBM Plex Sans Thai', system-ui, sans-serif;
    }
    .az-header__icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; border-radius: 12px; color: #1f3aa0;
      border: 1px solid #e5e7eb; background: #fff; text-decoration: none;
      transition: background .18s ease, transform .18s ease;
    }
    .az-header__icon:hover { background: #f1f4fb; transform: translateY(-1px); }
    .az-header__icon:focus-visible, .az-card:focus-visible { outline: 3px solid #3b3fb6; outline-offset: 2px; }
    .az-header__avatar {
      position: relative; width: 44px; height: 44px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center; background: #eef2fb; color: #1f3aa0;
    }
    .az-header__check {
      position: absolute; right: -2px; bottom: -2px; width: 16px; height: 16px; border-radius: 50%;
      background: #16a34a; color: #fff; display: inline-flex; align-items: center; justify-content: center; border: 2px solid #fff;
    }
    .az-header__left { display: flex; align-items: center; gap: 14px; }
    .az-header__right { display: flex; align-items: center; gap: 12px; }
    .az-brand { font-weight: 800; font-size: 18px; letter-spacing: -0.3px; color: #14266b; text-decoration: none; }
    .az-menu { position: relative; }
    .az-menu__btn {
      display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 14px;
      border: 1px solid #e5e7eb; background: #fff; border-radius: 10px; color: #1f3aa0;
      font-family: 'IBM Plex Sans Thai', system-ui, sans-serif; font-size: 14px; font-weight: 600; cursor: pointer;
      transition: background .15s;
    }
    .az-menu__btn:hover { background: #f1f4fb; }
    .az-menu__chev { transition: transform .18s; }
    .az-menu.open .az-menu__chev { transform: rotate(180deg); }
    .az-menu__panel {
      position: absolute; top: 50px; right: 0; min-width: 264px; background: #fff;
      border: 1px solid #e9eaee; border-radius: 12px; box-shadow: 0 14px 36px rgba(20,38,107,.18);
      padding: 6px; display: none; z-index: 200;
    }
    .az-menu.open .az-menu__panel { display: block; }
    .az-menu__panel a {
      display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-radius: 8px;
      color: #33415c; text-decoration: none; font-size: 14px; white-space: nowrap;
    }
    .az-menu__panel a:hover { background: #f1f4fb; color: #1f3aa0; }
    .az-menu__dot { width: 7px; height: 7px; border-radius: 50%; background: #2b6cc4; flex-shrink: 0; }
    @media (max-width: 520px) { .az-brand { display: none; } .az-menu__btn span { display: none; } .az-menu__btn { padding: 0 11px; } }

    .az-main { max-width: 1240px; margin: 0 auto; padding: 30px 22px 64px; }
    .az-headline {
      text-align: center; font-size: clamp(28px, 4.4vw, 46px); font-weight: 800;
      color: #14266b; letter-spacing: -0.5px; padding: 18px 0 8px;
    }
    .az-subhead { text-align: center; color: #6b7280; font-size: 14.5px; padding-bottom: 22px; }

    .az-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 300px));
      justify-content: center;
      gap: 20px;
    }

    .az-card {
      display: flex; flex-direction: column; background: #fff; border-radius: 16px; overflow: hidden;
      text-decoration: none; border: 1px solid #eceef2; box-shadow: 0 1px 2px rgba(20,38,107,.04);
      transition: transform .2s ease, box-shadow .2s ease; opacity: 0; transform: translateY(14px);
      animation: az-rise .5s cubic-bezier(.2,.7,.2,1) forwards; color: inherit; position: relative;
    }
    .az-card:hover { transform: translateY(-6px); box-shadow: 0 18px 38px rgba(20,38,107,.16); }
    @keyframes az-rise { to { opacity: 1; transform: translateY(0); } }

    .az-card--soon { cursor: default; }
    .az-card--soon:hover { transform: none; box-shadow: 0 1px 2px rgba(20,38,107,.04); }
    .az-card--soon .az-card__media, .az-card--soon .az-body { filter: grayscale(.35); opacity: .85; }

    .az-card__media {
      position: relative; aspect-ratio: 16 / 11; display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,.9); overflow: hidden;
    }
    .az-card__media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .az-card__icon { opacity: .55; position: relative; }
    .az-ribbon {
      position: absolute; top: 14px; right: -34px; width: 130px; text-align: center; transform: rotate(45deg);
      background: #e2231a; color: #fff; font-size: 12px; font-weight: 800; letter-spacing: 1px; padding: 5px 0;
      box-shadow: 0 4px 10px rgba(226,35,26,.35); z-index: 2;
    }
    .az-status {
      position: absolute; top: 12px; left: 12px; z-index: 2; font-size: 11.5px; font-weight: 700;
      padding: 4px 10px; border-radius: 999px; backdrop-filter: blur(4px);
    }
    .az-status--ready { background: rgba(22,163,74,.92); color: #fff; }
    .az-status--soon { background: rgba(55,65,81,.85); color: #fff; }

    .az-band { margin: 0; background: #243f9c; color: #fff; font-size: 17px; font-weight: 700; padding: 13px 16px; line-height: 1.3; }
    .az-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .az-tagline { color: #2b6cc4; font-weight: 700; font-size: 15.5px; line-height: 1.45; margin: 0; }
    .az-bullets { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .az-bullets li { position: relative; padding-left: 18px; font-size: 14.5px; line-height: 1.5; color: #4b5563; }
    .az-bullets li::before { content: ""; position: absolute; left: 2px; top: 8px; width: 6px; height: 6px; border-radius: 50%; background: #2b6cc4; }
    .az-cta { margin-top: auto; padding-top: 6px; font-size: 14px; font-weight: 700; color: #1f3aa0; display: inline-flex; align-items: center; gap: 6px; }
    .az-cta--soon { color: #9ca3af; }

    @media (prefers-reduced-motion: reduce) {
      .az-card { animation: none; opacity: 1; transform: none; }
      .az-card, .az-header__icon { transition: none; }
    }
  </style>
</head>
<body>
  <header class="az-header">
    <div class="az-header__left">
      <a href="./" class="az-header__icon" aria-label="หน้าแรก">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      </a>
      <a href="./" class="az-brand">Advisortool</a>
    </div>
    <div class="az-header__right">
      <div class="az-menu" id="azMenu">
        <button class="az-menu__btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="azMenuPanel">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          <span>เครื่องมือ</span>
          <svg class="az-menu__chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="az-menu__panel" id="azMenuPanel" role="menu">
          <a href="global-saving/" role="menuitem"><span class="az-menu__dot"></span>Global Saving Plus 15/8</a>
          <a href="ihealthy/" role="menuitem"><span class="az-menu__dot"></span>iHealthy Ultra</a>
          <a href="ci123/" role="menuitem"><span class="az-menu__dot"></span>CI 123 ประกันโรคร้ายแรง</a>
          <a href="group-insurance/" role="menuitem"><span class="az-menu__dot"></span>ประกันกลุ่ม Group Insurance</a>
          <a href="fhc/" role="menuitem"><span class="az-menu__dot"></span>FHC — แบบสอบถามคุณภาพชีวิต</a>
          <a href="career-agent/" role="menuitem"><span class="az-menu__dot"></span>Career-Agent-Question</a>
          <a href="agency/" role="menuitem"><span class="az-menu__dot"></span>Agency Blueprint</a>
        </div>
      </div>
      <span class="az-header__avatar" aria-label="โปรไฟล์">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span class="az-header__check"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
      </span>
    </div>
  </header>
  <script>
    (function () {
      var menu = document.getElementById('azMenu'), btn = menu.querySelector('.az-menu__btn');
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var open = menu.classList.toggle('open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      document.addEventListener('click', function (e) {
        if (!menu.contains(e.target)) { menu.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); }
      });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { menu.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); } });
    })();
  </script>

  <div class="az-shell">
    <main class="az-main">
      <h1 class="az-headline">Advisortool</h1>
      <p class="az-subhead">เลือกเครื่องมือที่ต้องการ กดการ์ดเพื่อเริ่มใช้งานได้เลย</p>
      <div class="az-grid" id="grid"></div>
    </main>
  </div>

  <script>
  // icon (inline SVG) fallback เมื่อไม่มีรูป cover
  const ICONS = {
    piggy: '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.4-1 2-2h2v-4h-2c0-1-.5-1.5-1-2V5z"/><path d="M2 9v1c0 1.1.9 2 2 2h1"/><circle cx="16" cy="11" r="1"/></svg>',
    heart: '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg>',
    activity: '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M17 12h-2l-2 5-2-10-2 5H7"/></svg>',
    users: '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
    clipboard: '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>',
    briefcase: '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect width="20" height="14" x="2" y="7" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>',
    network: '<svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="9" y="2" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="16" y="16" width="6" height="6" rx="1"/><path d="M12 8v4M5 16v-2a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v2"/></svg>',
  };
  const arrow = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';

  // ready: true → ลิงก์ไปหน้าวานิลลา | false → ยังเป็น React (เร็วๆ นี้)
  const products = [
    { ready: true, href: "global-saving/", band: "Global Saving Plus 15/8", tagline: "ยกระดับแผนการเงินเพื่ออนาคต สู่โอกาสรับผลตอบแทนระดับโลก",
      bullets: ["ชำระเบี้ยฯ 8 ปี ให้ความคุ้มครอง 15 ปี","รับเงินคืนทุกปี พร้อมโอกาสรับผลตอบแทนเพิ่มจากดัชนี Citi Grandmaster RC 5 Index","ผลประโยชน์การันตีเงินคืนรวมสูงสุด 815% ของจำนวนเงินเอาประกันภัย"],
      isNew: true, gradient: "linear-gradient(135deg, #1f3aa0 0%, #2b6cc4 55%, #4f9be0 100%)", image: "hub/global-saving.png", icon: ICONS.piggy },
    { ready: true, href: "ihealthy/", band: "iHealthy Ultra", tagline: "ประกันสุขภาพเหมาจ่าย ดูแลครบ จบทุกความกังวล",
      bullets: ["เปรียบเทียบแผนประกันสุขภาพและคำนวณเบี้ยรายบุคคล","ความคุ้มครองค่ารักษาพยาบาลแบบเหมาจ่าย","ลดหย่อนภาษีได้"],
      gradient: "linear-gradient(135deg, #0f766e 0%, #14a89a 55%, #5fd3c4 100%)", image: "hub/ihealthy.png", icon: ICONS.heart },
    { ready: true, href: "ci123/", band: "CI 123 ประกันโรคร้ายแรง", tagline: "เจอ จ่าย ครบ — ดูแลค่าใช้จ่ายเมื่อตรวจพบโรคร้าย",
      bullets: ["คุ้มครองโรคร้ายแรงครอบคลุมหลายระยะ","เครื่องคำนวณเบี้ยในตัว เลือกแผนได้เอง","ลดหย่อนภาษีได้"],
      gradient: "linear-gradient(135deg, #b91c1c 0%, #e2231a 55%, #f97316 100%)", image: "hub/ci123.png", icon: ICONS.activity },
    { ready: true, href: "group-insurance/", band: "ประกันกลุ่ม Group Insurance", tagline: "แผนความคุ้มครองสำหรับองค์กร พร้อมใบเสนอราคา",
      bullets: ["ประกันสุขภาพกลุ่ม / อุบัติเหตุกลุ่ม","สร้างใบเสนอราคาและดาวน์โหลด PDF ได้ทันที","เลือกแผนตามประเภทธุรกิจ"],
      gradient: "linear-gradient(135deg, #3b3fb6 0%, #6d5ae0 55%, #9a7af0 100%)", image: "hub/group-insurance.png", icon: ICONS.users },
    { ready: true, href: "fhc/", band: "FHC", tagline: "แบบสอบถามคุณภาพชีวิต — ประเมินสุขภาพการเงินอย่างรอบด้าน",
      bullets: ["กรอกอายุ รายได้ เงินเก็บ หนี้สิน คำนวณสดทันที","สรุปภาพรวมสินทรัพย์สุทธิและค่าความสามารถ","ส่งสรุปไป LINE ได้ทันที"],
      gradient: "linear-gradient(135deg, #b45309 0%, #d97757 55%, #fbbf24 100%)", image: "hub/fhc.png", icon: ICONS.clipboard },
    { ready: true, href: "career-agent/", band: "Career-Agent-Question", tagline: "แบบสอบถามความถนัดในอาชีพตัวแทน — ประเมินและส่งผลอัตโนมัติ",
      bullets: ["แบบสอบถามหลายส่วน + คำถามปลายเปิด","ให้คะแนนและจัดระดับ (เขียว/ส้ม/แดง) อัตโนมัติ","ส่งผลทางอีเมล/LINE และบันทึกคำตอบได้"],
      gradient: "linear-gradient(135deg, #1C1B1A 0%, #4a4641 55%, #d97757 100%)", image: "hub/career-agent.png", icon: ICONS.briefcase },
    { ready: true, href: "agency/", band: "Agency Blueprint", tagline: "ชุดเครื่องมือตัวแทน — คำนวณค่าบริหาร/รายได้ + แบบทดสอบผู้จัดการ",
      bullets: ["เครื่องคำนวณค่าบริหาร (commission)","เครื่องคำนวณรายได้ตัวแทน + โบนัส","แบบทดสอบความพร้อมผู้จัดการ"],
      gradient: "linear-gradient(135deg, #314059 0%, #5A8282 55%, #B48749 100%)", image: "hub/agency.png", icon: ICONS.network },
  ];

  const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const grid = document.getElementById('grid');

  grid.innerHTML = products.map((p, i) => {
    const tag = p.ready ? "พร้อมใช้งาน" : "เร็วๆ นี้";
    const tagClass = p.ready ? "az-status--ready" : "az-status--soon";
    const inner = `
      <div class="az-card__media" style="background:${p.gradient}">
        <img src="${esc(p.image)}" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
        <span class="az-card__icon" style="display:none">${p.icon}</span>
        <span class="az-status ${tagClass}">${tag}</span>
        ${p.isNew ? '<span class="az-ribbon">NEW</span>' : ''}
      </div>
      <h2 class="az-band">${esc(p.band)}</h2>
      <div class="az-body">
        <p class="az-tagline">${esc(p.tagline)}</p>
        <ul class="az-bullets">${p.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>
        ${p.ready
          ? `<span class="az-cta">เปิดแอป ${arrow}</span>`
          : `<span class="az-cta az-cta--soon">ยังเป็น React (เร็วๆ นี้)</span>`}
      </div>`;
    const delay = `style="animation-delay:${i * 80}ms"`;
    return p.ready
      ? `<a href="${esc(p.href)}" class="az-card" ${delay}>${inner}</a>`
      : `<div class="az-card az-card--soon" ${delay} title="ยังไม่ได้แปลงเป็นวานิลลา">${inner}</div>`;
  }).join('');
  </script>
</body>
</html>
