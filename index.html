  <style>
    /* ============================================================
       Advisortool — Hub · Editorial / Swiss monochrome system
       ink on paper · IBM Plex superfamily · hairline grid
       ============================================================ */
    :root {
      --ink:        #0b0b0c;   /* near-black */
      --ink-soft:   #2a2a2e;
      --gray-1:     #55555b;
      --gray-2:     #86868c;
      --gray-3:     #b6b5b0;
      --paper:      #f4f2ec;   /* warm off-white canvas */
      --card:       #fbfaf7;   /* card surface */
      --line:       #d8d5cc;   /* hairline */
      --line-mid:   #b2afa6;
      --header-h:   66px;
      --easing:     cubic-bezier(.2,.7,.2,1);
      --mono:       'IBM Plex Mono', ui-monospace, 'SFMono-Regular', monospace;
      --sans:       'IBM Plex Sans Thai', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: var(--sans);
      background: var(--paper);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    /* fine print-grain overlay for editorial atmosphere */
    body::before {
      content: ""; position: fixed; inset: 0; z-index: 1; pointer-events: none;
      opacity: .05; mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }

    /* ---------- Header ---------- */
    .az-header {
      position: sticky; top: 0; z-index: 120;
      display: flex; align-items: center; justify-content: space-between;
      height: var(--header-h); padding: 0 clamp(16px, 4vw, 40px);
      background: rgba(244,242,236,.86); backdrop-filter: blur(10px) saturate(1.1);
      border-bottom: 1px solid var(--ink);
    }
    .az-header__left { display: flex; align-items: center; gap: 16px; }
    .az-header__right { display: flex; align-items: center; gap: 14px; }
    .az-header__icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; color: var(--ink);
      border: 1px solid var(--ink); background: transparent; text-decoration: none;
      transition: background .18s var(--easing), color .18s var(--easing);
    }
    .az-header__icon:hover { background: var(--ink); color: var(--paper); }
    .az-brand {
      font-family: var(--mono); font-weight: 600; font-size: 15px;
      letter-spacing: .22em; text-transform: uppercase; color: var(--ink); text-decoration: none;
      display: inline-flex; align-items: baseline; gap: 8px;
    }
    .az-brand small { font-weight: 400; font-size: 11px; letter-spacing: .18em; color: var(--gray-2); }
    @media (max-width: 560px) { .az-brand small { display: none; } }
    .az-header__avatar {
      position: relative; width: 40px; height: 40px; border: 1px solid var(--ink);
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--ink); color: var(--paper);
    }
    .az-header__check {
      position: absolute; right: -6px; bottom: -6px; width: 16px; height: 16px;
      background: var(--paper); color: var(--ink); display: inline-flex;
      align-items: center; justify-content: center; border: 1px solid var(--ink);
    }
    .az-header__icon:focus-visible, .az-card:focus-visible,
    .az-header__avatar:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

    /* ---------- Masthead ---------- */
    .az-main { position: relative; z-index: 2; max-width: 1320px; margin: 0 auto; padding: clamp(28px, 5vw, 56px) clamp(16px, 4vw, 40px) 80px; }

    .az-masthead { margin-bottom: clamp(30px, 5vw, 52px); }
    .az-kicker {
      font-family: var(--mono); font-size: 12px; letter-spacing: .32em; text-transform: uppercase;
      color: var(--gray-1); display: flex; align-items: center; gap: 14px;
      opacity: 0; animation: az-fade .7s var(--easing) .05s forwards;
    }
    .az-kicker::before { content: ""; width: 34px; height: 1px; background: var(--ink); display: inline-block; }
    .az-title {
      font-weight: 700; font-size: clamp(34px, 6.6vw, 76px); line-height: .98; letter-spacing: -.02em;
      margin: 20px 0 0; max-width: 15ch;
      opacity: 0; animation: az-rise .8s var(--easing) .12s forwards;
    }
    .az-title em { font-style: normal; position: relative; }
    .az-lede {
      margin: 22px 0 0; font-size: clamp(15px, 1.8vw, 18px); line-height: 1.6; color: var(--gray-1);
      max-width: 52ch; font-weight: 400;
      opacity: 0; animation: az-rise .8s var(--easing) .2s forwards;
    }
    .az-meta {
      margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--ink);
      display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
      font-family: var(--mono); font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--gray-1);
      transform-origin: left; opacity: 0; animation: az-fade .8s var(--easing) .28s forwards;
    }
    .az-meta b { color: var(--ink); font-weight: 600; }

    /* ---------- Grid ---------- */
    .az-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
    @media (max-width: 1080px) { .az-grid { grid-template-columns: repeat(3, minmax(0,1fr)); } }
    @media (max-width: 820px)  { .az-grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; } }
    @media (max-width: 440px)  { .az-grid { grid-template-columns: 1fr; } }

    /* ---------- Card ---------- */
    .az-card {
      display: flex; flex-direction: column; background: var(--card); color: var(--ink);
      text-decoration: none; border: 1px solid var(--ink); position: relative;
      transition: transform .28s var(--easing), box-shadow .28s var(--easing);
      opacity: 0; transform: translateY(16px); animation: az-rise .6s var(--easing) forwards;
    }
    .az-card:hover { transform: translateY(-6px); box-shadow: 10px 12px 0 var(--ink); }

    .az-index {
      position: absolute; top: 10px; left: 12px; z-index: 3;
      font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: .1em;
      color: var(--paper); mix-blend-mode: difference;
    }
    .az-new {
      position: absolute; top: 10px; right: 12px; z-index: 3;
      font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase;
      color: var(--ink); background: var(--paper); border: 1px solid var(--ink); padding: 3px 8px;
    }

    .az-card__media {
      position: relative; aspect-ratio: 16 / 11; overflow: hidden;
      background: var(--ink); display: flex; align-items: center; justify-content: center;
      border-bottom: 1px solid var(--ink);
    }
    .az-card__media img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
      filter: grayscale(1) contrast(1.02) brightness(.98);
      transition: filter .4s var(--easing), transform .5s var(--easing);
    }
    .az-card:hover .az-card__media img { filter: grayscale(1) contrast(1.12) brightness(1.04); transform: scale(1.035); }
    .az-card__icon { position: relative; color: rgba(255,255,255,.42); }
    .az-card__icon svg { width: 52px; height: 52px; }

    .az-body { padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
    .az-band {
      margin: 0; font-weight: 700; font-size: 17px; line-height: 1.22; letter-spacing: -.01em; color: var(--ink);
    }
    .az-tagline { margin: 0; font-size: 14px; line-height: 1.5; color: var(--gray-1); font-weight: 400; }
    .az-bullets { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
    .az-bullets li { position: relative; padding-left: 18px; font-size: 13px; line-height: 1.5; color: var(--ink-soft); }
    .az-bullets li::before {
      content: ""; position: absolute; left: 0; top: 9px; width: 9px; height: 1px; background: var(--ink);
    }
    .az-cta {
      margin-top: auto; padding-top: 12px; display: flex; align-items: center; justify-content: space-between;
      font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase;
      color: var(--ink); border-top: 1px solid var(--line);
    }
    .az-cta svg { transition: transform .28s var(--easing); }
    .az-card:hover .az-cta svg { transform: translateX(5px); }

    /* soon / not-ready */
    .az-card--soon { cursor: default; }
    .az-card--soon:hover { transform: none; box-shadow: none; }
    .az-card--soon .az-card__media img { filter: grayscale(1) brightness(.7) contrast(.9); }
    .az-status {
      position: absolute; top: 10px; right: 12px; z-index: 3;
      font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
      color: var(--paper); background: var(--ink); padding: 3px 8px;
    }
    .az-cta--soon { color: var(--gray-2); }

    /* ---------- Footer ---------- */
    .az-foot {
      position: relative; z-index: 2; max-width: 1320px; margin: 0 auto;
      padding: 24px clamp(16px, 4vw, 40px) 48px; border-top: 1px solid var(--line);
      display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap;
      font-family: var(--mono); font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--gray-2);
    }

    /* ---------- Motion keyframes ---------- */
    @keyframes az-rise { to { opacity: 1; transform: translateY(0); } }
    @keyframes az-fade { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .az-card, .az-kicker, .az-title, .az-lede, .az-meta { animation: none; opacity: 1; transform: none; }
      .az-card, .az-header__icon, .az-card__media img, .az-cta svg { transition: none; }
    }
  </style>
</head>

    { ready: true, href: "fhc/", band: "FHC", tagline: "แบบสอบถามคุณภาพชีวิต — ประเมินสุขภาพการเงินอย่างรอบด้าน",
      bullets: ["กรอกอายุ รายได้ เงินเก็บ หนี้สิน คำนวณสดทันที","สรุปภาพรวมสินทรัพย์สุทธิและค่าความสามารถ","ส่งสรุปไป LINE ได้ทันที"],
      image: "hub/fhc.png", icon: ICONS.clipboard },
    { ready: true, href: "career-agent/", band: "Career-Agent-Question", tagline: "แบบสอบถามความถนัดในอาชีพตัวแทน — ประเมินและส่งผลอัตโนมัติ",
      bullets: ["แบบสอบถามหลายส่วน + คำถามปลายเปิด","ให้คะแนนและจัดระดับ (เขียว/ส้ม/แดง) อัตโนมัติ","ส่งผลทางอีเมล/LINE และบันทึกคำตอบได้"],
      image: "hub/career-agent.png", icon: ICONS.briefcase },
    { ready: true, href: "agency/", band: "Agency Blueprint", tagline: "ชุดเครื่องมือตัวแทน — คำนวณค่าบริหาร/รายได้ + แบบทดสอบผู้จัดการ",
      bullets: ["เครื่องคำนวณค่าบริหาร (commission)","เครื่องคำนวณรายได้ตัวแทน + โบนัส","แบบทดสอบความพร้อมผู้จัดการ"],
      image: "hub/agency.png", icon: ICONS.network },
  ];

  const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const pad = (n) => String(n).padStart(2, '0');
  const grid = document.getElementById('grid');

  grid.innerHTML = products.map((p, i) => {
    const inner = `
      <span class="az-index">N°${pad(i + 1)}</span>
      ${p.ready
        ? (p.isNew ? '<span class="az-new">New</span>' : '')
        : '<span class="az-status">เร็วๆ นี้</span>'}
      <div class="az-card__media">
        <img src="${esc(p.image)}" alt="" loading="lazy" decoding="async" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
        <span class="az-card__icon" style="display:none">${p.icon}</span>
      </div>
      <div class="az-body">
        <h2 class="az-band">${esc(p.band)}</h2>
        <p class="az-tagline">${esc(p.tagline)}</p>
        <ul class="az-bullets">${p.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>
        ${p.ready
          ? `<span class="az-cta">เปิดเครื่องมือ ${arrow}</span>`
          : `<span class="az-cta az-cta--soon">React · เร็วๆ นี้</span>`}
      </div>`;
    const delay = `style="animation-delay:${i * 70}ms"`;
    return p.ready
      ? `<a href="${esc(p.href)}" class="az-card" ${delay}>${inner}</a>`
      : `<div class="az-card az-card--soon" ${delay} title="ยังไม่ได้แปลงเป็นวานิลลา">${inner}</div>`;
  }).join('');

  document.getElementById('count').textContent = pad(products.filter(p => p.ready).length);
  </script>
