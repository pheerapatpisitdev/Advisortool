  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ported from _src/index.css */
    html { scroll-behavior: smooth; }
    html, body { min-height: 100vh; }
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: #1e293b;
      background: #fafbfc;
      font-family: 'Google Sans', 'Sarabun', 'Noto Sans Thai', system-ui, -apple-system, sans-serif;
    }
    *:focus-visible {
      outline: 2px solid transparent;
      outline-offset: 2px;
      box-shadow: 0 0 0 2px #fafbfc, 0 0 0 4px #0f766e;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background-color: #f1f5f9; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
    /* toggle switch */
    .gi-switch { position: relative; display: inline-flex; align-items: center; cursor: pointer; }
    .gi-switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .gi-switch .track { width: 44px; height: 24px; background: #e2e8f0; border-radius: 9999px; position: relative; transition: background .2s; }
    .gi-switch .track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: #fff; border-radius: 9999px; box-shadow: 0 1px 2px rgba(0,0,0,.1); transition: transform .2s; }
    .gi-switch input:checked + .track { background: #3f5e52; }
    .gi-switch input:checked + .track::after { transform: translateX(20px); }
    .tabular-nums { font-variant-numeric: tabular-nums; }

    /* --- coexist with the shared global header (sticky 64px bar at top of <body>) --- */
    /* The page is a full app-shell: its fixed full-height sidebar, sticky sub-header,
       and mobile menu button all anchor to top:0 and would sit under / over the global
       header. Offset them by --az-header-h so they live below it. */
    #app aside { top: var(--az-header-h, 64px) !important; height: calc(100vh - var(--az-header-h, 64px)) !important; }
    #app main > header { top: var(--az-header-h, 64px) !important; }
    #app [data-opensidebar] { top: calc(var(--az-header-h, 64px) + 8px) !important; }
    /* keep the page exactly one viewport tall (header is in normal flow) — no double scrollbar */
    #app > div { min-height: calc(100vh - var(--az-header-h, 64px)); }
    #app main { min-height: calc(100vh - var(--az-header-h, 64px)) !important; }
    /* assets/design-system.css centers every <main> (max-width:1180px; margin-inline:auto)
       and outranks Tailwind's .lg\:ml-72, so this page's <main> was centred instead of
       offset — the 288px fixed sidebar then covered its left edge (288px at 1024w,
       162px at 1440w). This <main> is an app shell, not a reading column: keep it
       full-width and restore the sidebar gutter. */
    #app main { max-width: none !important; margin-left: 0 !important; margin-right: 0 !important; }
    @media (min-width: 1024px) { #app main { margin-left: 18rem !important; } }

    /* --- a11y / touch-target / mobile fixes (see README) --- */
    /* screen-reader-only text (not in the prebuilt tailwind bundle) */
    .gi-sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
                  clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap; border:0; }

    /* Apple 44pt / Material 48dp minimum hit area. Declared here rather than as
       tailwind utilities because styles.css is a prebuilt bundle — classes that
       aren't already in it silently do nothing. */
    #app [data-plan], #app [data-rider], #app [data-lang],
    #app [data-pdf], #app [data-openquote], #app [data-shareline],
    #app [data-addgroup], #app [data-removegroup] { min-height: 44px; }
    #app [data-closesidebar], #app [data-quoteclose] { min-width: 44px; min-height: 44px; }

    /* iOS Safari zooms the whole page when a focused field is under 16px */
    #app input, #app select, #app textarea { font-size: 16px; }

    /* scroll lock while the quote dialog / mobile drawer owns the screen */
    html.gi-modal-open, html.gi-modal-open body { overflow: hidden; }
    /* those shared buttons sit at z-index 2147482000, i.e. above the dialog, where they
       land on its action row. While a dialog owns the screen, get them out of the way. */
    html.gi-modal-open .az-lock-btn { display: none !important; }

    /* right-edge fade telling the user a table scrolls sideways */
    .gi-hscroll { position: relative; }
    .gi-hscroll.is-scrollable::after {
      content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 40px;
      background: linear-gradient(to left, rgba(255,255,255,.96), rgba(255,255,255,0));
      pointer-events: none;
    }

    @media (max-width: 1023.98px) {
      /* the shared lock/sound buttons are fixed at bottom-LEFT, which is exactly
         where this page's business-code column lives. Park them bottom-right,
         where the table has already scrolled its content away. */
      body.az-unified > .az-lock-btn { left: auto !important; right: 14px !important; }
      body.az-unified > #az-sound-btn { right: 14px !important; left: auto !important; bottom: 66px !important; }
      /* let the 1,099-row table scroll with the page instead of trapping the finger
         in a 524px-tall box that holds 100,000px of content */
      #app [data-biz-scroll] { max-height: none !important; overflow-y: visible !important; }
    }

    /* --- play the slide-up animation only on page mount / nav change --- */
    /* render() rebuilds innerHTML on every keystroke & button press; without this the
       whole page would replay its entrance animation each time. The keyframe only runs
       when the root carries .gi-anim, which render() adds for first load + nav switches. */
    .animate-slide-up { animation: none; }
    .gi-anim .animate-slide-up { animation: slide-up .4s ease-out both; }
    @media (prefers-reduced-motion: reduce) {
      .gi-anim .animate-slide-up { animation: none; }
    }
  </style>
