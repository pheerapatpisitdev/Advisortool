<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ประกันภัยกลุ่ม — Group Insurance</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ported from _src/index.css */
    html { scroll-behavior: smooth; }
    html, body { min-height: 100vh; }
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: #1e293b;
      background: #fafbfc;
      font-family: 'Google Sans', 'Sarabun', 'Noto Sans Thai', system-ui, -apple-system, sans-serif;
    }
    *:focus-visible {
      outline: 2px solid transparent;
      outline-offset: 2px;
      box-shadow: 0 0 0 2px #fafbfc, 0 0 0 4px #0f766e;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background-color: #f1f5f9; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background-color: #94a3b8; }
    /* toggle switch */
    .gi-switch { position: relative; display: inline-flex; align-items: center; cursor: pointer; }
    .gi-switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .gi-switch .track { width: 44px; height: 24px; background: #e2e8f0; border-radius: 9999px; position: relative; transition: background .2s; }
    .gi-switch .track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: #fff; border-radius: 9999px; box-shadow: 0 1px 2px rgba(0,0,0,.1); transition: transform .2s; }
    .gi-switch input:checked + .track { background: #3f5e52; }
    .gi-switch input:checked + .track::after { transform: translateX(20px); }
    .tabular-nums { font-variant-numeric: tabular-nums; }
  </style>
  <!-- jsPDF + html2canvas for the PDF quote -->
  <script src="jspdf.umd.min.js"></script>
  <script src="html2canvas.min.js"></script>
  <script src="data.js"></script>
</head>
